name: Daily Competitor Refresh

# Refreshes a couple of competitors a day (picked by longest-stale
# last_scraped_at) and pushes the updated evidence straight to Sliq-website's
# main branch, which Vercel auto-deploys. See cron.yml for the separate
# monthly "catch anything ever marked pending" run — this one instead
# rotates through every competitor on a steady cadence regardless of status.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of competitors to refresh'
        default: '2'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout scraper repo
        uses: actions/checkout@v4
        with:
          path: sliqpay-programmatic-pages

      - name: Checkout Sliq-website
        uses: actions/checkout@v4
        with:
          repository: ARKS-Ventures/Sliq-website
          ssh-key: ${{ secrets.SLIQ_WEBSITE_DEPLOY_KEY }}
          path: Sliq-website
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sliqpay-programmatic-pages/package-lock.json

      - name: Install dependencies
        working-directory: sliqpay-programmatic-pages
        run: npm ci

      - name: Install Playwright browser
        working-directory: sliqpay-programmatic-pages
        run: npx playwright install chromium --with-deps

      - name: Pick today's competitors
        id: pick
        working-directory: sliqpay-programmatic-pages
        run: npx ts-node scripts/pickDailyCompetitors.ts "${{ github.event.inputs.count || 2 }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run pipeline for picked competitors
        working-directory: sliqpay-programmatic-pages
        run: npx ts-node scripts/runPipeline.ts --ids "${{ steps.pick.outputs.ids }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Export provider evidence into Sliq-website checkout
        working-directory: sliqpay-programmatic-pages
        run: npx ts-node scripts/exportProviderEvidence.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Commit and push if changed
        working-directory: Sliq-website
        run: |
          git config user.name "sliq-competitor-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/compare/providers src/content/compare/competitors.json
          if git diff --cached --quiet; then
            echo "No content changes — skipping commit."
          else
            git commit -m "chore: daily competitor refresh (${{ steps.pick.outputs.names }})"
            git push origin HEAD:main
          fi
